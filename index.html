<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLYSTV</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GLYSTV">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#191a28;--card:#fff;--tx:#2b2b2b;--mu:#8a8f9a;--ac:#3498db;--bd:#dcdfe4;--sub:#232536}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:#eceff4;font:15px/1.4 Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hide{display:none!important}
/* LOGIN */
#login{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:36px}
.logo{text-align:center}
.logo img{max-width:300px;width:75vw;display:block;margin:0 auto;mix-blend-mode:screen}
.logo .t{font-size:56px;font-weight:700;line-height:1;background:linear-gradient(180deg,#ffd23f,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #1d5fd6)}
.logo .s{display:inline-block;margin-top:6px;font-size:40px;font-weight:700;color:#2f8cff;letter-spacing:4px}
.box{width:100%;max-width:420px;background:var(--card);color:var(--tx);border-radius:12px;padding:26px 24px}
.box h2{margin:0 0 20px;text-align:center;font-size:24px;font-weight:700}
.box input[type=text],.box input[type=password],.box input[type=url]{width:100%;height:52px;margin-bottom:14px;border:1px solid var(--bd);border-radius:6px;padding:0 14px;font:inherit;color:var(--tx);background:#fff}
.box input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.box button{width:100%;height:52px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;font-size:17px;cursor:pointer}
.box button:disabled{opacity:.6}
.rem{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font-size:14px;color:var(--mu)}
#err{color:#d33;font-size:14px;margin-top:10px;text-align:center;min-height:18px}
.lnk{background:none;border:0;color:#9aa3b2;text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}
/* APP */
main{max-width:900px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top b{font-size:18px}
.top button{background:transparent;border:1px solid #3a3d52;color:#cfd4e0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
#now{margin:8px 2px;color:#9aa3b2;font-size:14px;min-height:20px}
.card{background:var(--sub);border-radius:12px;padding:12px;margin-top:12px}
textarea,#q{width:100%;background:var(--bg);color:#eceff4;border:1px solid #33364a;border-radius:8px;padding:10px;font:inherit}
textarea{height:90px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn,.card button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
#list{margin-top:8px;max-height:50vh;overflow-y:auto}
.ch{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #2f3246;cursor:pointer}
.ch.on{color:#5dade2;font-weight:600}
.ch img{width:32px;height:32px;object-fit:contain;border-radius:6px;background:var(--bg)}
.ch .g{margin-left:auto;color:#8a8f9a;font-size:12px}
#msg{color:#8a8f9a;font-size:13px;margin-top:6px}
</style>
</head>
<body>

<section id="login">
  <div class="logo">
    <img src="logo.png" alt="" onerror="this.remove();document.getElementById('lt').classList.remove('hide')">
    <div id="lt" class="hide"><div class="t">GLYS</div><div class="s">TV</div></div>
  </div>
  <div class="box">
    <h2>Ingresa tus datos</h2>
    <input id="srv" type="url" placeholder="Servidor (http://...)" class="hide" autocapitalize="off">
    <input id="usr" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="off">
    <input id="pwd" type="password" placeholder="Contraseña" autocomplete="current-password">
    <label class="rem"><input id="rem" type="checkbox" checked> Recordarme en este dispositivo</label>
    <button id="go">Login</button>
    <div id="err"></div>
  </div>
  <button class="lnk" id="m3u">Usar una lista M3U manualmente</button>
</section>

<main id="app" class="hide">
  <div class="top"><b>GLYSTV <small id="mode" style="font-weight:400;color:#8a8f9a"></small></b><button id="out">Salir</button></div>
  <video id="v" controls playsinline autoplay></video>
  <div id="now">Selecciona un canal para empezar</div>
  <button id="cp" class="lnk" style="margin:0 0 8px 2px">Copiar enlace del canal</button>
  <div class="card hide" id="m3ubox">
    <textarea id="txt" placeholder="Pega aquí el contenido de tu lista M3U (#EXTM3U ...)"></textarea>
    <div class="row">
      <button id="load">Cargar lista</button>
      <label class="btn">Subir archivo<input id="file" type="file" accept=".m3u,.m3u8,.txt" hidden></label>
    </div>
  </div>
  <div class="card">
    <input id="q" type="search" placeholder="Buscar canal o grupo…">
    <div id="msg"></div>
    <div id="list"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
/* ===== CONFIGURACIÓN =====
   Pon aquí la dirección de tu servicio (formato Xtream: usuario/contraseña).
   Ejemplo: "http://tu-servidor.com:8080". Si la dejas vacía, la pantalla de login pedirá el servidor. */
var SERVER = "https://aioplus.es:443";

var $=function(i){return document.getElementById(i)};
var v=$('v'),chans=[],hls=null,cur=-1,sess=null;
var NP=null;try{var C=window.Capacitor;if(C&&((C.isNativePlatform&&C.isNativePlatform())||(C.getPlatform&&C.getPlatform()!=='web')||(C.Plugins&&C.Plugins.NativePlayer))){NP=C.registerPlugin?C.registerPlugin('NativePlayer'):(C.Plugins&&C.Plugins.NativePlayer);if(NP)v.style.display='none'}}catch(e){}
$('mode').textContent=NP?'· nativo v8':'· web v8';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function show(app){$('login').classList.toggle('hide',app);$('app').classList.toggle('hide',!app)}
function norm(u){u=u.trim().replace(/\/+$/,'');return /^https?:\/\//i.test(u)?u:'http://'+u}

if(!SERVER)$('srv').classList.remove('hide');
try{var sv=JSON.parse(localStorage.getItem('tv_cred')||'null');
  if(sv){$('usr').value=sv.u||'';$('pwd').value=sv.p||'';if(sv.s)$('srv').value=sv.s}}catch(e){}

/* ---- Login (API Xtream) ---- */
$('go').onclick=async function(){
  var u=$('usr').value.trim(),p=$('pwd').value,s=SERVER||$('srv').value;
  $('err').textContent='';
  if(!u||!p||!s.trim()){$('err').textContent='Completa todos los datos.';return}
  s=norm(s);var b=$('go');b.disabled=true;b.textContent='Entrando…';
  try{
    var q='?username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p);
    var r=await fetch(s+'/player_api.php'+q);var d=await r.json();
    if(!d.user_info||d.user_info.auth==0)throw new Error('Usuario o contraseña incorrectos.');
    var cats={};
    try{(await (await fetch(s+'/player_api.php'+q+'&action=get_live_categories')).json()).forEach(function(c){cats[c.category_id]=c.category_name})}catch(e){}
    var ls=await (await fetch(s+'/player_api.php'+q+'&action=get_live_streams')).json();
    chans=ls.map(function(c){return{name:c.name,group:cats[c.category_id]||'',logo:c.stream_icon||'',
      url:s+'/live/'+encodeURIComponent(u)+'/'+encodeURIComponent(p)+'/'+c.stream_id+'.m3u8'}});
    try{if($('rem').checked)localStorage.setItem('tv_cred',JSON.stringify({u:u,p:p,s:SERVER?'':s}));else localStorage.removeItem('tv_cred')}catch(e){}
    sess=true;$('msg').textContent=chans.length+' canales';render();show(true);
  }catch(e){
    $('err').textContent=(e&&e.message&&e.message.indexOf('incorrectos')>0)?e.message:'No se pudo conectar. Revisa el servidor, tus datos o tu conexión.';
  }
  b.disabled=false;b.textContent='Login';
};
$('pwd').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
$('out').onclick=function(){if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');chans=[];cur=-1;try{localStorage.removeItem('tv_cred')}catch(e){}$('pwd').value='';show(false)};
$('m3u').onclick=function(){$('m3ubox').classList.remove('hide');render();show(true)};

/* ---- Lista M3U manual ---- */
function parse(t){var out=[],L=t.split(/\r?\n/),m=null;
  for(var i=0;i<L.length;i++){var l=L[i].trim();
    if(l.indexOf('#EXTINF')===0){var g=/group-title="([^"]*)"/.exec(l),lg=/tvg-logo="([^"]*)"/.exec(l);
      m={name:(l.split(',').slice(1).join(',')||'Sin nombre').trim(),group:g?g[1]:'',logo:lg?lg[1]:''}}
    else if(l&&l[0]!=='#'&&/^https?:\/\//i.test(l)){out.push({name:m?m.name:l,group:m?m.group:'',logo:m?m.logo:'',url:l});m=null}}
  return out}
function setList(t){chans=parse(t);cur=-1;render();$('msg').textContent=chans.length?chans.length+' canales cargados.':'No se encontraron canales válidos.'}
$('load').onclick=function(){setList($('txt').value)};
$('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){setList(String(r.result))};r.readAsText(f)};

/* ---- Lista y reproducción ---- */
function render(){var f=$('q').value.toLowerCase(),h='';
  chans.forEach(function(c,i){if(f&&(c.name+' '+c.group).toLowerCase().indexOf(f)<0)return;
    h+='<div class="ch'+(i===cur?' on':'')+'" data-i="'+i+'">'+(c.logo?'<img loading="lazy" alt="" src="'+esc(c.logo)+'">':'<img alt="">')+'<div>'+esc(c.name)+'</div><span class="g">'+esc(c.group)+'</span></div>'});
  $('list').innerHTML=h||'<div style="color:#8a8f9a;padding:8px">Sin canales.</div>'}
function play(i){var c=chans[i];if(!c)return;cur=i;$('now').textContent='Reproduciendo: '+c.name;render();
  if(NP){NP.play({url:c.url,title:c.name}).catch(function(e){$('now').textContent='No se pudo abrir el reproductor: '+(e&&e.message?e.message:e)});return}
  if(hls){hls.destroy();hls=null}v.onerror=null;v.onplaying=null;
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|\/hls|playlist/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})});
    hls.on(Hls.Events.ERROR,function(e,d){if(!d.fatal)return;var k=d.response&&d.response.code,info=d.details+(k?', HTTP '+k:'');if(hls){hls.destroy();hls=null}v.src=c.url;v.play().catch(function(){});$('now').textContent='Probando modo nativo ('+info+'): '+c.name;v.onerror=function(){$('now').textContent='Error ('+info+') y el modo nativo también falló: '+c.name};v.onplaying=function(){$('now').textContent='Reproduciendo: '+c.name}})}
  else{v.src=c.url;v.play().catch(function(){});v.onerror=function(){var m=v.error?v.error.code:'';$('now').textContent='Error de vídeo '+m+': '+c.name}}}
$('cp').onclick=function(){var c=chans[cur];if(!c){$('now').textContent='Primero elige un canal.';return}try{navigator.clipboard.writeText(c.url);$('cp').textContent='¡Copiado!'}catch(e){prompt('Enlace:',c.url)}setTimeout(function(){$('cp').textContent='Copiar enlace del canal'},1500)};
$('q').oninput=render;
$('list').onclick=function(e){var el=e.target.closest('.ch');if(el)play(+el.dataset.i)};
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
