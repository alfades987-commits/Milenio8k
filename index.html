<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi reproductor IPTV</title>
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IPTV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#6b7380;--ac:#4f46e5;--bd:#dfe3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#eceff4;--mu:#9aa3b2;--ac:#8b86ff;--bd:#2a2e37}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#eceff4;--mu:#9aa3b2;--ac:#8b86ff;--bd:#2a2e37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 12px}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
#now{margin:8px 2px;color:var(--mu);font-size:14px;min-height:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
textarea,input[type=search]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit}
textarea{height:90px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.sec,.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#list{margin-top:8px;max-height:50vh;overflow-y:auto}
.ch{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--bd);cursor:pointer}
.ch:last-child{border:0}
.ch.on{color:var(--ac);font-weight:600}
.ch img{width:32px;height:32px;object-fit:contain;border-radius:6px;background:var(--bg)}
.ch span.g{margin-left:auto;color:var(--mu);font-size:12px}
#msg{color:var(--mu);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>📺 Mi reproductor IPTV</h1>
<video id="v" controls playsinline autoplay></video>
<div id="now">Selecciona un canal para empezar</div>

<div class="card">
  <textarea id="txt" placeholder="Pega aquí el contenido de tu lista M3U (#EXTM3U ...)"></textarea>
  <div class="row">
    <button id="load">Cargar lista</button>
    <label class="btn sec">Subir archivo .m3u<input id="file" type="file" accept=".m3u,.m3u8,.txt" hidden></label>
  </div>
  <div id="msg">Usa solo listas y canales a los que tengas derecho legal de acceso.</div>
</div>

<div class="card">
  <input id="q" type="search" placeholder="Buscar canal o grupo…">
  <div id="list"></div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
var chans=[],hls=null,cur=-1;
var $=function(i){return document.getElementById(i)};
var v=$('v');

function parse(t){
  var out=[],lines=t.split(/\r?\n/),meta=null;
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(l.indexOf('#EXTINF')===0){
      var name=(l.split(',').slice(1).join(',')||'Sin nombre').trim();
      var g=/group-title="([^"]*)"/.exec(l),lg=/tvg-logo="([^"]*)"/.exec(l);
      meta={name:name,group:g?g[1]:'',logo:lg?lg[1]:''};
    }else if(l&&l[0]!=='#'&&/^https?:\/\//i.test(l)){
      out.push({name:meta?meta.name:l,group:meta?meta.group:'',logo:meta?meta.logo:'',url:l});
      meta=null;
    }
  }
  return out;
}

function render(){
  var f=$('q').value.toLowerCase(),h='';
  chans.forEach(function(c,i){
    if(f&&(c.name+' '+c.group).toLowerCase().indexOf(f)<0)return;
    h+='<div class="ch'+(i===cur?' on':'')+'" data-i="'+i+'">'+
      (c.logo?'<img loading="lazy" alt="" src="'+esc(c.logo)+'">':'<img alt="">')+
      '<div>'+esc(c.name)+'</div><span class="g">'+esc(c.group)+'</span></div>';
  });
  $('list').innerHTML=h||'<div style="color:var(--mu);padding:8px">Sin canales todavía.</div>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function play(i){
  var c=chans[i];if(!c)return;
  cur=i;$('now').textContent='Reproduciendo: '+c.name;render();
  if(hls){hls.destroy();hls=null}
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|\/hls|playlist/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})});
    hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal)$('now').textContent='No se pudo reproducir: '+c.name});
  }else{
    v.src=c.url;v.play().catch(function(){});
    v.onerror=function(){$('now').textContent='No se pudo reproducir: '+c.name};
  }
  try{localStorage.setItem('iptv_last',String(i))}catch(e){}
}

function setList(t){
  chans=parse(t);cur=-1;render();
  $('msg').textContent=chans.length?chans.length+' canales cargados.':'No se encontraron canales válidos en la lista.';
  try{localStorage.setItem('iptv_list',t)}catch(e){}
}

$('load').onclick=function(){setList($('txt').value)};
$('file').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){$('txt').value='';setList(String(r.result))};r.readAsText(f);
};
$('q').oninput=render;
$('list').onclick=function(e){
  var el=e.target.closest('.ch');if(el)play(+el.dataset.i);
};

try{var s=localStorage.getItem('iptv_list');if(s)setList(s)}catch(e){}
render();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
