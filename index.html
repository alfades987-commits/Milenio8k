<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLYSTV</title>
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GLYSTV">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0f1115;--sidebar:#14171f;--card:#1a1d26;--tx:#eceff4;--mu:#8a8f9a;--ac:#e50914;--bd:#2a2e3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Poppins,system-ui,sans-serif;display:flex;min-height:100vh}
.hide{display:none!important}

/* SIDEBAR & LAYOUT */
aside{width:260px;background:var(--sidebar);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:24px 16px;position:fixed;top:0;bottom:0;z-index:100}
.brand{font-size:22px;font-weight:700;color:#fff;margin-bottom:30px;display:flex;align-items:center;gap:10px}
.brand span{color:var(--ac)}
.menu{display:flex;flex-direction:column;gap:8px;flex:1}
.menu-item{background:transparent;border:0;color:var(--mu);text-align:left;padding:12px 16px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px;transition:0.2s}
.menu-item:hover,.menu-item.active{background:var(--ac);color:#fff}

content-area{margin-left:260px;flex:1;padding:24px;max-width:calc(100vw - 260px)}
@media(max-width:768px){aside{display:none}content-area{margin-left:0;max-width:100%;padding:16px}}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.login-box{width:100%;max-width:400px;background:var(--sidebar);border:1px solid var(--bd);border-radius:16px;padding:30px}
.login-box h2{margin:0 0 20px;text-align:center;font-size:24px}
.login-box input{width:100%;height:48px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:0 14px;color:var(--tx);font:inherit;margin-bottom:14px}
.login-box button{width:100%;height:48px;background:var(--ac);color:#fff;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
#err{color:#ff4d4d;font-size:13px;text-align:center;margin-top:10px}

/* HERO BANNER */
.hero{background:linear-gradient(rgba(0,0,0,0.3),rgba(15,17,21,1)),url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80') center/cover;border-radius:16px;padding:40px;margin-bottom:30px;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:36px;margin:0 0 10px}
.hero p{color:var(--mu);max-width:600px;margin:0 0 20px}
.hero-btn{background:var(--ac);color:#fff;border:0;padding:10px 24px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;width:fit-content}

/* GRID & CARDS */
.section-title{font-size:20px;font-weight:600;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:30px}
.card-item{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--bd);cursor:pointer;transition:transform 0.2s}
.card-item:hover{transform:scale(1.03)}
.card-item img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#000}
.card-info{padding:10px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* PLAYER & SEARCH */
.player-container{background:var(--sidebar);border-radius:16px;padding:20px;margin-bottom:24px;border:1px solid var(--bd)}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;display:block}
.search-bar{width:100%;height:48px;background:var(--sidebar);border:1px solid var(--bd);border-radius:8px;padding:0 16px;color:var(--tx);font:inherit;margin-bottom:20px}
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2><span>GLYS</span>TV</h2>
    <input id="usr" type="text" placeholder="Usuario" autocapitalize="off">
    <input id="pwd" type="password" placeholder="Contraseña">
    <button id="go">Iniciar Sesión</button>
    <div id="err"></div>
  </div>
</div>

<!-- MENÚ LATERAL -->
<aside>
  <div class="brand"><span>GLYS</span>TV</div>
  <div class="menu">
    <button class="menu-item active" data-tab="home">🏠 Inicio</button>
    <button class="menu-item" data-tab="live">📺 TV en Vivo</button>
    <button class="menu-item" data-tab="movies">🎬 Películas</button>
    <button class="menu-item" data-tab="series">📺 Series</button>
  </div>
  <button class="menu-item" id="out" style="color:#ff4d4d">🚪 Salir</button>
</aside>

<!-- CONTENIDO PRINCIPAL -->
<content-area>
  <div id="view-home">
    <div class="hero">
      <h1>The Last of Us</h1>
      <p>En un mundo devastado, la esperanza sobrevive en los lazos más inesperados.</p>
      <button class="hero-btn">Ver ahora</button>
    </div>
    <div class="section-title">Contenido Destacado</div>
    <div class="grid" id="home-grid"></div>
  </div>

  <div id="view-player" class="hide">
    <div class="player-container">
      <video id="v" controls playsinline autoplay></video>
      <div id="now" style="margin-top:10px;font-weight:600">Selecciona un elemento</div>
    </div>
  </div>

  <div id="view-content" class="hide">
    <input class="search-bar" id="q" type="search" placeholder="Buscar contenido...">
    <div class="grid" id="main-grid"></div>
  </div>
</content-area>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
var SERVER = "https://aioplus.es:443";
var $=function(i){return document.getElementById(i)};
var v=$('v'), chans=[], currentTab='home';

function showLogin(show){ $('login-screen').classList.toggle('hide', !show); }

$('go').onclick = async function(){
  var u=$('usr').value.trim(), p=$('pwd').value;
  if(!u || !p){ $('err').textContent='Completa los datos.'; return; }
  $('go').textContent='Entrando...';
  try{
    var q='?username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p);
    var r=await fetch(SERVER+'/player_api.php'+q); var d=await r.json();
    if(!d.user_info || d.user_info.auth==0) throw new Error('Datos incorrectos');
    
    var ls = await (await fetch(SERVER+'/player_api.php'+q+'&action=get_live_streams')).json();
    chans = ls.map(function(c){return {name:c.name, logo:c.stream_icon, url:SERVER+'/live/'+u+'/'+p+'/'+c.stream_id+'.m3u8'}});
    
    showLogin(false);
    renderGrid(chans.slice(0, 12), 'home-grid');
    renderGrid(chans, 'main-grid');
  }catch(e){ $('err').textContent='Error de conexión o datos inválidos.'; }
  $('go').textContent='Iniciar Sesión';
};

function renderGrid(data, containerId){
  var h='';
  data.forEach(function(c, i){
    h+='<div class="card-item" data-i="'+i+'"><img src="'+(c.logo||'')+'" alt=""><div class="card-info">'+c.name+'</div></div>';
  });
  $(containerId).innerHTML = h || '<div style="color:var(--mu)">Sin elementos.</div>';
}

document.querySelectorAll('.menu-item[data-tab]').forEach(function(btn){
  btn.onclick = function(){
    document.querySelectorAll('.menu-item').forEach(function(b){b.classList.remove('active')});
    this.classList.add('active');
    var tab = this.dataset.tab;
    $('view-home').classList.toggle('hide', tab !== 'home');
    $('view-content').classList.toggle('hide', tab === 'home');
    if(tab !== 'home') renderGrid(chans, 'main-grid');
  };
});

$('home-grid').onclick = $('main-grid').onclick = function(e){
  var card = e.target.closest('.card-item');
  if(!card) return;
  var idx = card.dataset.i;
  var c = chans[idx];
  if(!c) return;
  
  $('view-home').classList.add('hide');
  $('view-content').classList.add('hide');
  $('view-player').classList.remove('hide');
  $('now').textContent = 'Reproduciendo: ' + c.name;
  
  if(window.Hls && Hls.isSupported()){
    var hls = new Hls(); hls.loadSource(c.url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ v.play(); });
  } else { v.src = c.url; v.play(); }
};

$('out').onclick = function(){ showLogin(true); };
</script>
</body>
</html>
