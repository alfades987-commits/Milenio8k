<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLYSTV</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GLYSTV">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#141626;--card:#fff;--tx:#2b2b2b;--mu:#8a8f9a;--ac:#3498db;--bd:#dcdfe4;--sub:#1d2033}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#eceff4;font:15px/1.4 Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hide{display:none!important}
/* LOGIN */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:36px}
.logo{text-align:center}
.logo img{max-width:300px;width:75vw;display:block;margin:0 auto;mix-blend-mode:screen}
.logo .t{font-size:56px;font-weight:700;line-height:1;background:linear-gradient(180deg,#ffd23f,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .s{display:inline-block;margin-top:6px;font-size:40px;font-weight:700;color:#2f8cff;letter-spacing:4px}
.box{width:100%;max-width:420px;background:var(--card);color:var(--tx);border-radius:14px;padding:26px 24px}
.box h2{margin:0 0 20px;text-align:center;font-size:24px;font-weight:700}
.box input[type=text],.box input[type=password],.box input[type=url]{width:100%;height:52px;margin-bottom:14px;border:1px solid var(--bd);border-radius:8px;padding:0 14px;font:inherit;color:var(--tx);background:#fff}
.box input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.box button{width:100%;height:52px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-size:17px;cursor:pointer}
.box button:disabled{opacity:.6}
.rem{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font-size:14px;color:var(--mu)}
#err{color:#d33;font-size:14px;margin-top:10px;text-align:center;min-height:18px}
.lnk{background:none;border:0;color:#9aa3b2;text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}
/* APP */
main{max-width:900px;margin:0 auto;padding:12px}
.ghost{background:transparent;border:1px solid #3a3d52;color:#cfd4e0;border-radius:10px;padding:7px 13px;font:inherit;cursor:pointer}
.hd{display:flex;align-items:center;gap:10px;padding:2px 0 4px}
.hd img{width:42px;height:42px;object-fit:cover;object-position:top;mix-blend-mode:screen}
.hd b{font-size:19px;letter-spacing:.5px}
.hd small{display:block;font-size:11px;color:#8a8f9a;font-weight:400;letter-spacing:0}
.hd .sp{flex:1}
#hclock{font-weight:600;color:#cfd4e0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.tile{border-radius:18px;padding:14px;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.tile:active{transform:scale(.98)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px}
.tile b{display:block;font-size:17px}
.tile small{opacity:.85;font-size:12px}
.t1{background:linear-gradient(135deg,#1c5fa8,#27a3c6)}
.t2{background:linear-gradient(135deg,#4d2f9a,#7c52d6)}
.t3{background:linear-gradient(135deg,#17775a,#2fb98c)}
.t4{background:linear-gradient(135deg,#a8691a,#dca437)}
.sh{margin:20px 2px 8px;color:#9aa3b2;font-size:14px;font-weight:600}
.rowh{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rowh::-webkit-scrollbar{display:none}
.hc{flex:0 0 108px;cursor:pointer}
.im{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#242740}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im.lg img{object-fit:contain;padding:14px}
.tt{margin-top:6px;font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top b{font-size:18px}
#tabs{display:flex;gap:8px;margin:0 0 10px}
#tabs button{flex:1;background:var(--sub);color:#cfd4e0;border:1px solid #33364a;border-radius:10px;padding:9px 4px;font:inherit;font-size:14px;cursor:pointer}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}
#now{margin:8px 2px;color:#9aa3b2;font-size:14px;min-height:20px}
.card{background:var(--sub);border-radius:14px;padding:12px;margin-top:12px}
textarea,#q,#cq{width:100%;background:var(--bg);color:#eceff4;border:1px solid #33364a;border-radius:10px;padding:10px;font:inherit}
#cq{margin-bottom:8px}
textarea{height:90px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn,.card button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
#list{margin-top:8px;max-height:60vh;overflow-y:auto}
#list.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-height:none;overflow:visible}
.pc{cursor:pointer}
.pc.on .tt,.ch.on{color:#5dade2}
.ch{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #2a2d45;cursor:pointer}
.ch.on{font-weight:600}
.ch img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:var(--bg)}
.ch .g{margin-left:auto;color:#8a8f9a;font-size:12px;text-align:right}
.st{color:#f5c542;cursor:pointer}
.ch .st{font-size:20px;padding:4px 2px 4px 8px}
.im .st{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:15px}
#msg{color:#8a8f9a;font-size:13px;margin:6px 0}
#cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.cc{flex:0 0 auto;white-space:nowrap;background:var(--sub);color:#cfd4e0;border:1px solid #33364a;border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.cc em{font-style:normal;color:#8a8f9a;font-size:12px}
.cc.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cc.on em{color:#e8f4fd}
.im .rt{position:absolute;top:4px;left:4px;background:#2b7bd1;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
@media (orientation:landscape) and (min-width:560px){
  main{max-width:none;padding:10px 14px}
  #lv:not(.hide){display:grid;grid-template-columns:minmax(210px,30%) minmax(0,1fr);gap:16px;align-items:start}
  #side{position:sticky;top:0;max-height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:none}
  #side::-webkit-scrollbar{display:none}
  #tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:8px}
  #cats{display:block;overflow:visible}
  .cc{display:flex;justify-content:space-between;width:100%;border-radius:10px;margin-bottom:6px;white-space:normal;text-align:left}
  #list.grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  #list{max-height:none}
  #pane .card{margin-top:0}
}
</style>
</head>
<body>

<section id="login">
  <div class="logo">
    <img src="logo.png" alt="" onerror="this.remove();document.getElementById('lt').classList.remove('hide')">
    <div id="lt" class="hide"><div class="t">GLYS</div><div class="s">TV</div></div>
  </div>
  <div class="box">
    <h2>Ingresa tus datos</h2>
    <input id="srv" type="url" placeholder="Servidor (http://...)" class="hide" autocapitalize="off">
    <input id="usr" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="off">
    <input id="pwd" type="password" placeholder="Contraseña" autocomplete="current-password">
    <label class="rem"><input id="rem" type="checkbox" checked> Recordarme en este dispositivo</label>
    <button id="go">Login</button>
    <div id="err"></div>
  </div>
  <button class="lnk" id="m3u">Usar una lista M3U manualmente</button>
</section>

<main id="app" class="hide">

  <!-- INICIO -->
  <section id="home">
    <div class="hd">
      <img src="logo.png" alt="" onerror="this.remove()">
      <b>GLYSTV<small id="hmode"></small></b>
      <span class="sp"></span>
      <span id="hclock"></span>
      <button class="ghost" id="out">Salir</button>
    </div>
    <div class="tiles">
      <div class="tile t1" data-go="live"><div class="ic">📺</div><div><b>TV en vivo</b><small id="c_live"> </small></div></div>
      <div class="tile t2" data-go="vod"><div class="ic">🎬</div><div><b>Películas</b><small>Explorar</small></div></div>
      <div class="tile t3" data-go="series"><div class="ic">🍿</div><div><b>Series</b><small>Explorar</small></div></div>
      <div class="tile t4" data-go="favs"><div class="ic">⭐</div><div><b>Favoritos</b><small id="c_favs"> </small></div></div>
    </div>
    <div id="recSec" class="hide"><div class="sh">Visto recientemente</div><div class="rowh" id="recRow"></div></div>
    <div id="favSec" class="hide"><div class="sh">Tus favoritos</div><div class="rowh" id="favRow"></div></div>
  </section>

  <!-- LISTAS Y REPRODUCTOR -->
  <section id="lv" class="hide">
    <aside id="side">
      <div class="top"><button class="ghost" id="ib">← Inicio</button><b id="sec"></b></div>
      <div id="tabs">
        <button data-t="live" class="on">TV</button><button data-t="vod">Películas</button><button data-t="series">Series</button><button data-t="favs">⭐</button>
      </div>
      <input id="cq" type="search" placeholder="Buscar en categorías">
      <div id="cats"></div>
    </aside>
    <div id="pane">
      <video id="v" controls playsinline autoplay></video>
      <div id="now">Selecciona un canal para empezar</div>
      <button id="cp" class="lnk" style="margin:0 0 8px 2px">Copiar enlace del canal</button>
      <div class="card hide" id="m3ubox">
        <textarea id="txt" placeholder="Pega aquí el contenido de tu lista M3U (#EXTM3U ...)"></textarea>
        <div class="row">
          <button id="load">Cargar lista</button>
          <label class="btn">Subir archivo<input id="file" type="file" accept=".m3u,.m3u8,.txt" hidden></label>
        </div>
      </div>
      <div class="card">
        <input id="q" type="search" placeholder="Buscar…">
        <button id="back" class="lnk hide">← Volver a la lista</button>
        <div id="msg"></div>
        <div id="list"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
/* ===== CONFIGURACIÓN =====
   Dirección de tu servicio (formato Xtream: usuario/contraseña).
   Si la dejas vacía, la pantalla de login pedirá el servidor. */
var SERVER = "https://aioplus.es:443";

var $=function(i){return document.getElementById(i)};
var v=$('v'),chans=[],hls=null,cur=-1,sess=null,seriesPrev=null,tab='live',lim=100,epMode=false;
var data={live:null,vod:null,series:null},catsCache={},strCache={},favs=[],recs=[],curCat='',catItems=[];

/* Reproductor nativo (solo en la app Android) */
var NP=null;try{var C=window.Capacitor;if(C&&((C.isNativePlatform&&C.isNativePlatform())||(C.getPlatform&&C.getPlatform()!=='web')||(C.Plugins&&C.Plugins.NativePlayer))){NP=C.registerPlugin?C.registerPlugin('NativePlayer'):(C.Plugins&&C.Plugins.NativePlayer);if(NP)v.style.display='none'}}catch(e){}
$('hmode').textContent=NP?'nativo v11':'web v11';

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function enc(x){return encodeURIComponent(x)}
function show(app){$('login').classList.toggle('hide',app);$('app').classList.toggle('hide',!app)}
function norm(u){u=u.trim().replace(/\/+$/,'');return /^https?:\/\//i.test(u)?u:'http://'+u}
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
function sv(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
favs=ld('tv_favs');recs=ld('tv_rec');

/* ---- Favoritos y recientes ---- */
function key(c){return c.series?'s'+c.series:c.url}
function isFav(c){var k=key(c);return favs.some(function(f){return key(f)===k})}
function toggleFav(c){var k=key(c),i=-1;favs.forEach(function(f,j){if(key(f)===k)i=j});
  if(i>=0)favs.splice(i,1);else favs.unshift({name:c.name,group:c.group||'',logo:c.logo||'',url:c.url||'',series:c.series||''});
  sv('tv_favs',favs)}
function addRec(c){if(!c.url)return;recs=recs.filter(function(r){return r.url!==c.url});
  recs.unshift({name:c.name,group:c.group||'',logo:c.logo||'',url:c.url});recs=recs.slice(0,12);sv('tv_rec',recs)}

/* ---- Pantallas ---- */
function tick(){var d=new Date();$('hclock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);
function card(c,src,i){var lg=/\/live\//.test(c.url||'');
  return '<div class="hc" data-src="'+src+'" data-i="'+i+'"><div class="im'+(lg?' lg':'')+'">'+(c.logo?'<img loading="lazy" alt="" src="'+esc(c.logo)+'">':'')+'</div><div class="tt">'+esc(c.name)+'</div></div>'}
function renderHome(){
  $('c_live').textContent=data.live?data.live.length+' canales':' ';
  $('c_favs').textContent=favs.length+' guardados';
  $('recRow').innerHTML=recs.map(function(c,i){return card(c,'rec',i)}).join('');
  $('favRow').innerHTML=favs.map(function(c,i){return card(c,'fav',i)}).join('');
  $('recSec').classList.toggle('hide',!recs.length);$('favSec').classList.toggle('hide',!favs.length)}
function showHome(){$('home').classList.remove('hide');$('lv').classList.add('hide');renderHome();window.scrollTo(0,0)}
function showList(){if(!$('home').classList.contains('hide')){try{history.pushState({lv:1},'')}catch(e){}}
  $('home').classList.add('hide');$('lv').classList.remove('hide');window.scrollTo(0,0)}
window.addEventListener('popstate',function(){if($('app').classList.contains('hide'))return;if(sess)showHome();else show(false)});
$('ib').onclick=function(){history.back()};
$('home').onclick=function(e){
  var t=e.target.closest('[data-go]');
  if(t){showList();loadTab(t.dataset.go);return}
  var h=e.target.closest('.hc');if(!h)return;
  var c=(h.dataset.src==='rec'?recs:favs)[+h.dataset.i];if(!c)return;
  if(c.series){showList();loadTab('favs');openSeries(c);return}
  chans=[c];cur=-1;if(!NP)showList();play(0);renderHome()};

/* ---- Login (API Xtream) ---- */
if(!SERVER)$('srv').classList.remove('hide');
try{var sc=JSON.parse(localStorage.getItem('tv_cred')||'null');
  if(sc){$('usr').value=sc.u||'';$('pwd').value=sc.p||'';if(sc.s)$('srv').value=sc.s}}catch(e){}
$('go').onclick=async function(){
  var u=$('usr').value.trim(),p=$('pwd').value,s=SERVER||$('srv').value;
  $('err').textContent='';
  if(!u||!p||!s.trim()){$('err').textContent='Completa todos los datos.';return}
  s=norm(s);var b=$('go');b.disabled=true;b.textContent='Entrando…';
  try{
    var q='?username='+enc(u)+'&password='+enc(p);
    var d=await (await fetch(s+'/player_api.php'+q)).json();
    if(!d.user_info||d.user_info.auth==0)throw new Error('Usuario o contraseña incorrectos.');
    var cats={};
    try{(await (await fetch(s+'/player_api.php'+q+'&action=get_live_categories')).json()).forEach(function(c){cats[c.category_id]=c.category_name})}catch(e){}
    var ls=await (await fetch(s+'/player_api.php'+q+'&action=get_live_streams')).json();
    var live=ls.map(function(c){return{name:c.name,group:cats[c.category_id]||'',logo:c.stream_icon||'',
      url:s+'/live/'+enc(u)+'/'+enc(p)+'/'+c.stream_id+'.m3u8'}});
    try{if($('rem').checked)localStorage.setItem('tv_cred',JSON.stringify({u:u,p:p,s:SERVER?'':s}));else localStorage.removeItem('tv_cred')}catch(e){}
    sess={s:s,u:u,p:p};data={live:live,vod:null,series:null};catsCache={};strCache={};
    $('tabs').classList.remove('hide');$('m3ubox').classList.add('hide');
    show(true);showHome();
  }catch(e){
    $('err').textContent=(e&&e.message&&e.message.indexOf('incorrectos')>0)?e.message:'No se pudo conectar. Revisa el servidor, tus datos o tu conexión.';
  }
  b.disabled=false;b.textContent='Login';
};
$('pwd').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
$('out').onclick=function(){
  if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');
  chans=[];cur=-1;sess=null;data={live:null,vod:null,series:null};
  try{localStorage.removeItem('tv_cred')}catch(e){}
  $('pwd').value='';$('home').classList.remove('hide');$('lv').classList.add('hide');show(false)};
$('m3u').onclick=function(){
  sess=null;tab='live';lim=100;epMode=false;chans=[];
  curCat='';catItems=[];$('tabs').classList.add('hide');$('cats').classList.add('hide');$('cq').classList.add('hide');$('back').classList.add('hide');$('m3ubox').classList.remove('hide');
  $('sec').textContent='Lista M3U';$('msg').textContent='';show(true);showList();render()};

/* ---- Lista M3U manual ---- */
function parse(t){var out=[],L=t.split(/\r?\n/),m=null;
  for(var i=0;i<L.length;i++){var l=L[i].trim();
    if(l.indexOf('#EXTINF')===0){var g=/group-title="([^"]*)"/.exec(l),lg=/tvg-logo="([^"]*)"/.exec(l);
      m={name:(l.split(',').slice(1).join(',')||'Sin nombre').trim(),group:g?g[1]:'',logo:lg?lg[1]:''}}
    else if(l&&l[0]!=='#'&&/^https?:\/\//i.test(l)){out.push({name:m?m.name:l,group:m?m.group:'',logo:m?m.logo:'',url:l});m=null}}
  return out}
function setList(t){chans=parse(t);cur=-1;lim=100;render();$('msg').textContent=chans.length?chans.length+' canales cargados.':'No se encontraron canales válidos.'}
$('load').onclick=function(){setList($('txt').value)};
$('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){setList(String(r.result))};r.readAsText(f)};

/* ---- Lista y reproducción ---- */
function render(){
  var f=$('q').value.toLowerCase(),h='',n=0,tot=0,lv=(tab==='live'&&sess),g=curCat,
      grid=!!sess&&!epMode&&(tab==='vod'||tab==='series');
  chans.forEach(function(c,i){
    if(lv&&g&&c.group!==g)return;
    if(f&&(c.name+' '+c.group).toLowerCase().indexOf(f)<0)return;
    tot++;if(n>=lim)return;n++;
    var img=c.logo?'<img loading="lazy" alt="" src="'+esc(c.logo)+'">':'',
        star=epMode?'':'<span class="st" data-i="'+i+'">'+(isFav(c)?'★':'☆')+'</span>';
    if(grid)h+='<div class="pc'+(i===cur?' on':'')+'" data-i="'+i+'"><div class="im">'+img+bd(c)+star+'</div><div class="tt">'+esc(c.name)+'</div></div>';
    else h+='<div class="ch'+(i===cur?' on':'')+'" data-i="'+i+'">'+(c.logo?img:'<img alt="">')+'<div>'+esc(c.name)+'</div><span class="g">'+esc(c.group)+'</span>'+star+'</div>'});
  if(tot>n)h+='<button id="more" class="lnk" style="width:100%;padding:12px;grid-column:1/-1">Mostrar más ('+(tot-n)+' restantes)</button>';
  $('list').className=grid?'grid':'';
  $('list').innerHTML=h||'<div style="color:#8a8f9a;padding:8px">Sin resultados.</div>'}
function bd(c){var r=parseFloat(c.rate);return r>0?'<span class="rt">'+r.toFixed(1)+'</span>':''}
function play(i){var c=chans[i];if(!c)return;cur=i;addRec(c);$('now').textContent='Reproduciendo: '+c.name;render();
  if(NP){NP.play({url:c.url,title:c.name}).catch(function(e){$('now').textContent='No se pudo abrir el reproductor: '+(e&&e.message?e.message:e)});return}
  if(hls){hls.destroy();hls=null}v.onerror=null;v.onplaying=null;
  if(window.Hls&&Hls.isSupported()&&/\.m3u8|\/hls|playlist/i.test(c.url)){
    hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})});
    hls.on(Hls.Events.ERROR,function(e,d){if(!d.fatal)return;var k=d.response&&d.response.code,info=d.details+(k?', HTTP '+k:'');if(hls){hls.destroy();hls=null}v.src=c.url;v.play().catch(function(){});$('now').textContent='Probando modo nativo ('+info+'): '+c.name;v.onerror=function(){$('now').textContent='Error ('+info+') y el modo nativo también falló: '+c.name};v.onplaying=function(){$('now').textContent='Reproduciendo: '+c.name}})}
  else{v.src=c.url;v.play().catch(function(){});v.onerror=function(){var m=v.error?v.error.code:'';$('now').textContent='Error de vídeo '+m+': '+c.name}}}
$('cp').onclick=function(){var c=chans[cur];if(!c){$('now').textContent='Primero elige un canal.';return}try{navigator.clipboard.writeText(c.url);$('cp').textContent='¡Copiado!'}catch(e){prompt('Enlace:',c.url)}setTimeout(function(){$('cp').textContent='Copiar enlace del canal'},1500)};

function api(a,extra){return fetch(sess.s+'/player_api.php?username='+enc(sess.u)+'&password='+enc(sess.p)+'&action='+a+(extra||'')).then(function(r){return r.json()})}
async function loadTab(t){
  tab=t;lim=100;epMode=false;curCat='';catItems=[];
  Array.prototype.forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.dataset.t===t)});
  $('sec').textContent={live:'TV en vivo',vod:'Películas',series:'Series',favs:'Favoritos'}[t];
  $('back').classList.add('hide');$('q').value='';$('cq').value='';
  var nc=(t==='favs');$('cats').classList.toggle('hide',nc);$('cq').classList.toggle('hide',nc);
  if(t==='favs'){chans=favs;cur=-1;$('cats').innerHTML='';
    $('msg').textContent=favs.length?favs.length+' favoritos':'Aún no tienes favoritos. Toca la ⭐ de cualquier elemento.';render();return}
  if(t==='live'){
    var gs={},tot=data.live.length;data.live.forEach(function(c){if(c.group)gs[c.group]=(gs[c.group]||0)+1});
    catItems=[{id:'',name:'TODO',n:tot}].concat(Object.keys(gs).sort().map(function(g){return{id:g,name:g,n:gs[g]}}));
    renderCats();chans=data.live;cur=-1;$('msg').textContent=tot+' canales';render();return;
  }
  chans=[];cur=-1;$('cats').innerHTML='<div style="color:#8a8f9a;padding:6px">Cargando categorías…</div>';render();$('msg').textContent='';
  try{
    if(!catsCache[t])catsCache[t]=await api(t==='vod'?'get_vod_categories':'get_series_categories');
    if(tab!==t)return;
    catItems=catsCache[t].map(function(c){return{id:c.category_id,name:c.category_name}});
    renderCats();
    if(catItems.length)selectCat(catItems[0].id);else $('msg').textContent='No hay categorías.';
  }catch(e){$('msg').textContent='No se pudo cargar esta sección.'}
}
function renderCats(){
  var f=$('cq').value.toLowerCase(),h='';
  catItems.forEach(function(c,i){
    if(f&&c.name.toLowerCase().indexOf(f)<0)return;
    h+='<button class="cc'+(String(c.id)===String(curCat)?' on':'')+'" data-i="'+i+'"><span>'+esc(c.name)+'</span>'+(c.n!=null?'<em>'+c.n+'</em>':'')+'</button>'});
  $('cats').innerHTML=h}
function selectCat(id){curCat=id;renderCats();if(tab==='live'){lim=100;render()}else loadCat(id)}
$('cats').onclick=function(e){var b=e.target.closest('.cc');if(!b)return;var c=catItems[+b.dataset.i];if(c)selectCat(c.id)};
$('cq').oninput=renderCats;
async function loadCat(id){
  if(!id)return;
  var t=tab,k=t+':'+id;lim=100;epMode=false;$('q').value='';$('back').classList.add('hide');
  $('msg').textContent='Cargando…';chans=[];render();
  try{
    if(!strCache[k]){
      var ls=await api(t==='vod'?'get_vod_streams':'get_series','&category_id='+enc(id));
      strCache[k]=ls.map(function(c){return t==='vod'
        ?{name:c.name,group:'',logo:c.stream_icon||'',rate:c.rating,url:sess.s+'/movie/'+enc(sess.u)+'/'+enc(sess.p)+'/'+c.stream_id+'.'+(c.container_extension||'mp4')}
        :{name:c.name,group:'',logo:c.cover||'',rate:c.rating,series:c.series_id}});
    }
    if(tab!==t)return;
    chans=strCache[k];cur=-1;$('msg').textContent=chans.length+' elementos';render();
  }catch(e){$('msg').textContent='No se pudo cargar la categoría.'}
}
async function openSeries(c){
  $('msg').textContent='Cargando episodios…';
  try{
    var d=await api('get_series_info','&series_id='+c.series),ss=d.episodes||{},eps=[];
    Object.keys(ss).sort(function(a,b){return a-b}).forEach(function(sn){(ss[sn]||[]).forEach(function(e){
      eps.push({name:'T'+sn+' E'+e.episode_num+' · '+(e.title||''),group:c.name,logo:(e.info&&e.info.movie_image)||c.logo,
        url:sess.s+'/series/'+enc(sess.u)+'/'+enc(sess.p)+'/'+e.id+'.'+(e.container_extension||'mp4')})})});
    seriesPrev=chans;chans=eps;cur=-1;lim=100;epMode=true;$('q').value='';$('back').classList.remove('hide');
    $('msg').textContent=c.name+' · '+eps.length+' episodios';render();
  }catch(e){$('msg').textContent='No se pudieron cargar los episodios.'}
}
$('back').onclick=function(){if(seriesPrev){chans=seriesPrev;cur=-1;lim=100;epMode=false;$('back').classList.add('hide');
  $('msg').textContent=tab==='favs'?favs.length+' favoritos':chans.length+' elementos';render()}};
$('tabs').onclick=function(e){var b=e.target.closest('button');if(b)loadTab(b.dataset.t)};
$('q').oninput=function(){lim=100;render()};
$('list').onclick=function(e){
  if(e.target.id==='more'){lim+=100;render();return}
  var st=e.target.closest('.st');
  if(st){var c0=chans[+st.dataset.i];if(c0){toggleFav(c0);if(tab==='favs')$('msg').textContent=favs.length+' favoritos';render()}return}
  var el=e.target.closest('[data-i]');if(!el)return;var i=+el.dataset.i;
  if(chans[i]&&chans[i].series)openSeries(chans[i]);else play(i)};
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
