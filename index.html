<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLYSTV</title>
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GLYSTV">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#08090c;--card:#111216;--tx:#f5f5f5;--mu:#a7a7ad;--ac:#e50914;--bd:#303036;--sub:#15161b;--gold:#d7ad55;--red:#e50914}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -15%,#321013 0%,#0b0b0e 42%,#07080a 100%);color:#f4f4f5;font:14px/1.4 Poppins,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hide{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:24px}
.logo text-align:center}
.logo img{max-width:320px;filter:drop-shadow(0 0 20px rgba(229,9,20,.18))}
.logo .t{font-size:56px;font-weight:700;line-height:1;background:linear-gradient(180deg,#ffe4a0,#c99a38);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .s{display:inline-block;margin-top:6px;font-size:40px;font-weight:700;color:#e50914;letter-spacing:4px}
.box{width:100%;max-width:420px;background:linear-gradient(160deg,#17181d,#0f1014);color:#f5f5f5;border:1px solid #343238;border-radius:18px;box-shadow:0 18px 55px #0009;padding:28px 24px}
.box h2{margin:0 0 20px;text-align:center;font-size:24px;font-weight:700}
.box input[type=text],.box input[type=password],.box input[type=url]{width:100%;height:52px;margin-bottom:14px;border:1px solid #34343b;border-radius:10px;padding:0 14px;font:inherit;color:#fff;background:#090a0d}
.box input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.box button{width:100%;height:52px;border:0;border-radius:10px;background:linear-gradient(110deg,#c9000b,#f01824);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 7px 18px #e5091428}
.rem{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font-size:14px;color:#c1c1c7}
#err{color:#ff7b82;font-size:14px;margin-top:10px;text-align:center;min-height:18px}
.lnk{background:none;border:0;color:#d4b56d;text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}

/* APP GENERAL */
main{max-width:1600px;margin:0 auto;padding:16px;height:100vh;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #292326;margin-bottom:14px}
.hd img{width:40px;height:40px;object-fit:contain}
.hd b{font-size:22px;color:#f7f7f7}
.hd small{display:block;font-size:11px;color:#aaa}
.hd .sp{flex:1}
#hclock{font-weight:600;color:#d8b96c;font-size:16px}
.brand4k{color:var(--gold);font-weight:700}
.ghost{background:#111216;border:1px solid #3b3032;color:#f4f4f5;border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}

/* VISTA HORIZONTAL ESTILO TV */
.tiles-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}
.tile-card{background:linear-gradient(135deg,#1b1b21,#0e0f12);border:1px solid #343036;border-radius:14px;padding:20px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 24px #0005;display:flex;flex-direction:column;justify-content:space-between;min-height:130px}
.tile-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.tile-card:nth-child(2):before{background:var(--gold)}
.tile-card:nth-child(3):before{background:#a73a40}
.tile-card:nth-child(4):before{background:var(--gold)}
.tile-card .ic{width:46px;height:46px;border-radius:12px;background:#e5091420;border:1px solid #e5091455;display:grid;place-items:center;font-size:22px;color:#ff626a;margin-bottom:10px}
.tile-card b{font-size:18px;display:block;color:#fff}
.tile-card small{color:#b8b8bf;font-size:13px}

/* PANTALLA PRINCIPAL CON PANELES LATERALES */
#lv{display:flex;flex-direction:column;flex:1;min-height:0}
.top-nav{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.top-nav button{background:#17171c;color:#d7d7dc;border:1px solid #38343a;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.top-nav button.on{background:#e50914;border-color:#e50914;color:#fff}

.layout-split{display:flex;gap:16px;flex:1;min-height:0}

/* PANEL IZQUIERDO: BUSCADOR ÚNICO + CATEGORÍAS + LISTA */
.left-panel{flex:0 0 420px;display:flex;flex-direction:column;gap:10px;min-height:0}
.search-box{width:100%;background:#0c0d10;color:#f5f5f5;border:1px solid #39353b;border-radius:9px;padding:10px 14px;font:inherit}
.cat-list{background:#151519;border:1px solid #373239;border-radius:10px;padding:6px;overflow-y:auto;max-height:180px}
.cc{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:#cfd4e0;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;font:inherit}
.cc:hover,.cc.on{background:#e50914;color:#fff}
.cc em{font-style:normal;font-size:12px;color:#aaa}

.channels-list{flex:1;background:#151519;border:1px solid #373239;border-radius:10px;overflow-y:auto;padding:6px}
.ch{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #28262b;cursor:pointer;border-radius:8px}
.ch:hover,.ch.on{background:#e509141b;outline:1px solid #e5091455;color:#fff}
.ch .nm{width:35px;color:#8a8f9a;font-size:13px;text-align:right}
.ch img{width:36px;height:36px;object-fit:contain;background:#000;border-radius:6px}
.ch .nx{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:#e6bd58;font-size:18px;cursor:pointer;padding:0 4px}

/* PANEL DERECHO: REPRODUCTOR Y ACCIONES */
.right-panel{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
#pv{width:100%;aspect-ratio:16/9;background:#000;border:1px solid #383238;border-radius:12px;overflow:hidden;position:relative}
#pv video{width:100%;height:100%;display:block}
.now-info{background:#141419;border:1px solid #302d33;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.now-title{font-size:18px;font-weight:600;color:#f1d58e;display:flex;align-items:center;justify-content:space-between}
.actions-row{display:flex;gap:10px}
.actions-row button{background:#1f2026;border:1px solid #38343a;color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:500;display:flex;align-items:center;gap:6px}
.actions-row button:hover{background:#e50914;border-color:#e50914}

@media (max-width:900px){
  .layout-split{flex-direction:column}
  .left-panel{flex:0 0 auto;max-height:50vh}
  .tiles-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<section id="login">
  <div class="logo">
    <img src="logo.png" alt="" onerror="this.remove();document.getElementById('lt').classList.remove('hide')">
    <div id="lt" class="hide"><div class="t">Milenio</div><div class="s">4K</div></div>
  </div>
  <div class="box">
    <h2>Bienvenido a <span class="brand4k">GLYSTV</span></h2>
    <input id="srv" type="url" placeholder="Servidor (http://...)" class="hide" autocapitalize="off">
    <input id="usr" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="off">
    <input id="pwd" type="password" placeholder="Contraseña" autocomplete="current-password">
    <label class="rem"><input id="rem" type="checkbox" checked> Recordarme en este dispositivo</label>
    <button id="go">INICIAR SESIÓN</button>
    <div id="err"></div>
  </div>
  <button class="lnk" id="m3u">Cargar lista M3U manualmente</button>
</section>

<main id="app" class="hide">
  <div class="hd">
    <img src="logo.png" alt="" onerror="this.remove()">
    <div><b>Milenio<span class="brand4k">4K</span></b><small id="hmode"></small></div>
    <span class="sp"></span>
    <span id="hclock"></span>
    <button class="ghost" id="out">Salir</button>
  </div>

  <!-- INICIO -->
  <section id="home">
    <div class="tiles-grid">
      <div class="tile-card" data-go="live"><div class="ic">📺</div><div><b>TV en vivo</b><small id="c_live">Cargando...</small></div></div>
      <div class="tile-card" data-go="vod"><div class="ic">🎬</div><div><b>Películas</b><small>Explorar catálogo</small></div></div>
      <div class="tile-card" data-go="series"><div class="ic">🍿</div><div><b>Series</b><small>Explorar episodios</small></div></div>
      <div class="tile-card" data-go="favs"><div class="ic">⭐</div><div><b>Favoritos</b><small id="c_favs">0 guardados</small></div></div>
    </div>
  </section>

  <!-- LISTAS Y REPRODUCTOR -->
  <section id="lv" class="hide">
    <div class="top-nav" id="tabs">
      <button data-t="live" class="on">TV en vivo</button>
      <button data-t="vod">Películas</button>
      <button data-t="series">Series</button>
      <button data-t="favs">⭐ Favoritos</button>
    </div>

    <div class="layout-split">
      <!-- PANEL IZQUIERDO -->
      <div class="left-panel">
        <input id="q" class="search-box" type="search" placeholder="Buscar canales o elementos...">
        <div class="cat-list" id="cats"></div>
        <div class="channels-list" id="list"></div>
      </div>

      <!-- PANEL DERECHO -->
      <div class="right-panel">
        <div id="pv"><video id="v" controls playsinline autoplay></video></div>
        <div class="now-info">
          <div class="now-title"><span id="now">Elige un canal para empezar</span><span id="favBtn" class="st" style="display:none">☆</span></div>
          <div class="actions-row">
            <button id="epgBtn">📅 EPG</button>
            <button id="favActionBtn">🤍 Agregar a los favoritos</button>
            <button id="cp" class="ghost">Copiar enlace</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
var SERVER = "https://aioplus.es:443";
var $=function(i){return document.getElementById(i)};
var v=$('v'),chans=[],hls=null,cur=-1,sess=null,tab='live';
var data={live:null,vod:null,series:null},catsCache={},strCache={},favs=[],recs=[],curCat='',catItems=[];

favs=ld('tv_favs');recs=ld('tv_rec');
function ld(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}}
function sv(k,a){try{localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function enc(x){return encodeURIComponent(x)}
function norm(u){u=u.trim().replace(/\/+$/,'');return /^https?:\/\//i.test(u)?u:'http://'+u}

function tick(){var d=new Date();$('hclock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);

function show(app){$('login').classList.toggle('hide',app);$('app').classList.toggle('hide',!app)}

try{var sc=JSON.parse(localStorage.getItem('tv_cred')||'null');if(sc){$('usr').value=sc.u||'';$('pwd').value=sc.p||'';if(sc.s)$('srv').value=sc.s}}catch(e){}
$('go').onclick=async function(){
  var u=$('usr').value.trim(),p=$('pwd').value,s=SERVER||$('srv').value;
  if(!u||!p||!s){$('err').textContent='Completa todos los datos.';return}
  s=norm(s);var b=$('go');b.disabled=true;b.textContent='Entrando…';
  try{
    var q='?username='+enc(u)+'&password='+enc(p);
    var d=await (await fetch(s+'/player_api.php'+q)).json();
    if(!d.user_info||d.user_info.auth==0)throw new Error('Datos incorrectos');
    var cats={};
    try{(await (await fetch(s+'/player_api.php'+q+'&action=get_live_categories')).json()).forEach(function(c){cats[c.category_id]=c.category_name})}catch(e){}
    var ls=await (await fetch(s+'/player_api.php'+q+'&action=get_live_streams')).json();
    var live=ls.map(function(c){return{name:c.name,group:cats[c.category_id]||'',logo:c.stream_icon||'',url:s+'/live/'+enc(u)+'/'+enc(p)+'/'+c.stream_id+'.m3u8'}});
    if($('rem').checked)localStorage.setItem('tv_cred',JSON.stringify({u:u,p:p,s:SERVER?'':s}));
    sess={s:s,u:u,p:p};data={live:live,vod:null,series:null};
    show(true);showHome();
  }catch(e){$('err').textContent='Error de conexión o datos inválidos.'}
  b.disabled=false;b.textContent='INICIAR SESIÓN';
};

$('out').onclick=function(){sess=null;show(false);$('home').classList.remove('hide');$('lv').classList.add('hide')};

function showHome(){
  $('home').classList.remove('hide');$('lv').classList.add('hide');
  $('c_live').textContent=data.live?data.live.length+' canales':' ';
  $('c_favs').textContent=favs.length+' guardados';
}

document.querySelectorAll('[data-go]').forEach(function(el){
  el.onclick=function(){
    var t=el.dataset.go;
    $('home').classList.add('hide');$('lv').classList.remove('hide');
    loadTab(t);
  }
});

async function loadTab(t){
  tab=t;curCat='';catItems=[];chans=[];
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  if(t==='favs'){chans=favs;renderCats();renderList();return}
  if(t==='live'){
    var gs={},tot=data.live.length;data.live.forEach(function(c){if(c.group)gs[c.group]=(gs[c.group]||0)+1});
    catItems=[{id:'',name:'TODAS',n:tot}].concat(Object.keys(gs).sort().map(function(g){return{id:g,name:g,n:gs[g]}}));
    renderCats();selectCat('');return;
  }
  try{
    if(!catsCache[t])catsCache[t]=await api(t==='vod'?'get_vod_categories':'get_series_categories');
    catItems=catsCache[t].map(function(c){return{id:c.category_id,name:c.category_name}});
    renderCats();if(catItems.length)selectCat(catItems[0].id);
  }catch(e){}
}

function api(a,extra){return fetch(sess.s+'/player_api.php?username='+enc(sess.u)+'&password='+enc(sess.p)+'&action='+a+(extra||'')).then(function(r){return r.json()})}

function renderCats(){
  var h='';
  catItems.forEach(function(c){
    h+='<button class="cc'+(String(c.id)===String(curCat)?' on':'')+'" data-id="'+esc(c.id)+'"><span>'+esc(c.name)+'</span>'+(c.n!=null?'<em>'+c.n+'</em>':'')+'</button>';
  });
  $('cats').innerHTML=h||'<div style="color:#aaa;padding:6px">Sin categorías</div>';
}

$('cats').onclick=function(e){
  var btn=e.target.closest('.cc');if(!btn)return;
  selectCat(btn.dataset.id);
};

function selectCat(id){
  curCat=id;renderCats();
  if(tab==='live'){renderList();}
  else{loadCat(id);}
}

async function loadCat(id){
  if(!id)return;
  var k=tab+':'+id;$('list').innerHTML='<div style="color:#aaa;padding:10px">Cargando...</div>';
  try{
    if(!strCache[k]){
      var ls=await api(tab==='vod'?'get_vod_streams':'get_series','&category_id='+enc(id));
      strCache[k]=ls.map(function(c){return tab==='vod'?{name:c.name,logo:c.stream_icon||'',url:sess.s+'/movie/'+enc(sess.u)+'/'+enc(sess.p)+'/'+c.stream_id+'.mp4'}:{name:c.name,logo:c.cover||'',series:c.series_id}});
    }
    chans=strCache[k];renderList();
  }catch(e){$('list').innerHTML='<div style="color:#f78;padding:10px">Error al cargar</div>'}
}

function renderList(){
  var f=$('q').value.toLowerCase(),h='',tot=0;
  var activeList=(tab==='live')?data.live.filter(function(c){return curCat===''||c.group===curCat}):chans;
  
  activeList.forEach(function(c,i){
    if(f&&c.name.toLowerCase().indexOf(f)<0)return;
    tot++;
    h+='<div class="ch'+(i===cur?' on':'')+'" data-i="'+i+'"><span class="nm">'+tot+'</span>'+(c.logo?'<img src="'+esc(c.logo)+'">':'<img alt="">')+'<div class="nx">'+esc(c.name)+'</div><span class="st" data-i="'+i+'">☆</span></div>';
  });
  $('list').innerHTML=h||'<div style="color:#aaa;padding:10px">No hay elementos</div>';
}

$('q').oninput=renderList;

$('list').onclick=function(e){
  var st=e.target.closest('.st');
  if(st){
    var idx=+st.dataset.i;
    var activeList=(tab==='live')?data.live.filter(function(c){return curCat===''||c.group===curCat}):chans;
    var c=activeList[idx];
    if(c){favs.push(c);sv('tv_favs',favs);alert('Añadido a favoritos');}
    return;
  }
  var row=e.target.closest('.ch');if(!row)return;
  var i=+row.dataset.i;play(i);
};

function play(i){
  var activeList=(tab==='live')?data.live.filter(function(c){return curCat===''||c.group===curCat}):chans;
  var c=activeList[i];if(!c)return;cur=i;renderList();
  $('now').textContent=c.name;
  v.src=c.url;v.play().catch(function(){});
}

$('cp').onclick=function(){
  var activeList=(tab==='live')?data.live.filter(function(c){return curCat===''||c.group===curCat}):chans;
  if(activeList[cur])navigator.clipboard.writeText(activeList[cur].url);
  alert('Enlace copiado');
};
</script>
</body>
  </html>
